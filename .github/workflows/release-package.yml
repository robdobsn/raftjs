name: Publish Package to npmjs
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to checkout'
        required: false
        default: 'main'
      npm_tag:
        description: 'The npm dist-tag to publish'
        required: false
        default: 'latest'

# Required for OIDC trusted publishing
permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch || 'main' }}

      - name: Setup Node.js for npm
        uses: actions/setup-node@v5
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build-all
      
      - name: Use npm 11 for trusted publishing
        run: npm install -g npm@11.15.0

      - name: Publish package
        env:
          NPM_DIST_TAG: ${{ github.event.inputs.npm_tag || 'latest' }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"
